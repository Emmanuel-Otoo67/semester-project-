spring:
  application:
    name: libtrack-api
  datasource:
    url: ${SUPABASE_APP_DB_URL:${SUPABASE_DB_URL:${LIBTRACK_DB_URL:jdbc:postgresql://localhost:5433/libtrack}}}
    username: ${SUPABASE_APP_DB_USER:${SUPABASE_DB_USER:${LIBTRACK_DB_USER:libtrack}}}
    password: ${SUPABASE_APP_DB_PASSWORD:${SUPABASE_DB_PASSWORD:${LIBTRACK_DB_PASSWORD:libtrack_dev_password}}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
libtrack:
  security:
    username: ${LIBTRACK_ADMIN_USERNAME}
    password: ${LIBTRACK_ADMIN_PASSWORD}
  cors:
    allowed-origin: ${LIBTRACK_CORS_ORIGIN:http://localhost:5173}

